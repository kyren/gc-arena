[workspace]
resolver = "2"

members = [
    "derive",
]

[workspace.package]
version = "0.7.0"
authors = ["kyren <catherine@kyju.org>", "moulins", "Aaron Hill <aa1ronham@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kyren/gc-arena"

[package]
name = "gc-arena"
description = "safe, incrementally garbage collected arenas"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["ahash?/std"]
tracing = ["dep:tracing"]

[dependencies]
ahash = { version = "0.8", optional = true, default-features = false }
enum-map = { version = "2.7", optional = true, default-features = false }
gc-arena-derive = { path = "./derive", version = "0.7.0"}
hashbrown = { version = "0.17", optional = true, default-features = false }
indexmap = { version = "2.13", optional = true, default-features = false }
slotmap = { version = "1.1", optional = true, default-features = false }
smallvec = { version = "1.15", optional = true, default-features = false }
tracing = { version = "0.1.37", optional = true, default-features = false }

[dev-dependencies]
rand = "0.10"
trybuild = "1.0"
